name: libvlc3

on:
  push:
    branches:
      - libvlc3
      - libvlcjni-3.x
      - upstream/libvlcjni-3.x
    tags:
      - 'libvlc-*'
  pull_request:
  workflow_dispatch:
    inputs:
      vlc_sha:
        description: Optional VLC commit to pin; empty means the latest 3.0.x tip
        required: false
        default: ''
        type: string
      publish_package:
        description: Publish the universal AAR to GitHub Packages
        required: false
        default: false
        type: boolean
      maven_version:
        description: Maven version used when publish_package is enabled
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: libvlc3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VLC_GIT_URL: https://github.com/178meorg/vlc.git
  VLC_GIT_BRANCH: 3.0.x
  MAVEN_GROUP_ID: io.github.178meorg
  MAVEN_ARTIFACT_ID: libvlc3-all
  MAVEN_REPOSITORY_URL: https://maven.pkg.github.com/178meorg/libvlcjni

jobs:
  resolve-vlc:
    name: resolve-vlc-commit
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - name: Select VLC commit
        id: select
        shell: bash
        env:
          PINNED_SHA: ${{ inputs.vlc_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$PINNED_SHA" ]]; then
            selected_sha="$PINNED_SHA"
          else
            selected_sha="$(git ls-remote "$VLC_GIT_URL" "refs/heads/$VLC_GIT_BRANCH" | awk 'NR == 1 { print $1 }')"
          fi
          test -n "$selected_sha"
          echo "sha=$selected_sha" >> "$GITHUB_OUTPUT"
          echo "Using VLC commit $selected_sha"

  build-native:
    name: native-${{ matrix.name }}
    needs: resolve-vlc
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armv7
            arch: arm
            abi_dir: armeabi-v7a
            image: registry.videolan.org/vlc-debian-android-3.0:20260701183656
          - name: arm64
            arch: arm64
            abi_dir: arm64-v8a
            image: registry.videolan.org/vlc-debian-android:20260611225331
    env:
      ARCH: ${{ matrix.arch }}
      ABI_DIR: ${{ matrix.abi_dir }}
      VLC_GIT_SHA: ${{ needs.resolve-vlc.outputs.sha }}

    steps:
      - name: Check out libvlcjni
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch VLC source without project patches
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf vlc
          ./buildsystem/get-vlc.sh \
            --no-patches \
            --vlcgit "$VLC_GIT_URL" \
            --vlcbranch "$VLC_GIT_BRANCH" \
            --vlchash "$VLC_GIT_SHA"

      - name: Build native libraries
        shell: bash
        run: |
          set -euxo pipefail
          ./buildsystem/compile-libvlc.sh -a "$ARCH"
          test -s "libvlc/jni/libs/$ABI_DIR/libvlc.so"
          test -s "libvlc/jni/libs/$ABI_DIR/libvlcjni.so"
          test -s "libvlc/jni/libs/$ABI_DIR/libc++_shared.so"
          file "libvlc/jni/libs/$ABI_DIR/libvlc.so" "libvlc/jni/libs/$ABI_DIR/libvlcjni.so"

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: libvlc/jni/libs/${{ matrix.abi_dir }}/*.so
          if-no-files-found: error
          retention-days: 7

  package-aar:
    name: package-universal-aar
    needs: [resolve-vlc, build-native]
    runs-on: ubuntu-24.04
    container:
      image: registry.videolan.org/vlc-debian-android:20260611225331
      options: --user root
    env:
      VLC_GIT_SHA: ${{ needs.resolve-vlc.outputs.sha }}
      GRADLE_ABI: all
    steps:
      - name: Check out libvlcjni
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch VLC assets without project patches
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf vlc
          ./buildsystem/get-vlc.sh \
            --no-patches \
            --vlcgit "$VLC_GIT_URL" \
            --vlcbranch "$VLC_GIT_BRANCH" \
            --vlchash "$VLC_GIT_SHA"

      - name: Download armv7 libraries
        uses: actions/download-artifact@v4
        with:
          name: native-armv7
          path: libvlc/jni/libs/armeabi-v7a

      - name: Download arm64 libraries
        uses: actions/download-artifact@v4
        with:
          name: native-arm64
          path: libvlc/jni/libs/arm64-v8a

      - name: Verify native libraries
        shell: bash
        run: |
          set -euxo pipefail
          test -s libvlc/jni/libs/armeabi-v7a/libvlc.so
          test -s libvlc/jni/libs/armeabi-v7a/libvlcjni.so
          test -s libvlc/jni/libs/armeabi-v7a/libc++_shared.so
          test -s libvlc/jni/libs/arm64-v8a/libvlc.so
          test -s libvlc/jni/libs/arm64-v8a/libvlcjni.so
          test -s libvlc/jni/libs/arm64-v8a/libc++_shared.so

      - name: Assemble universal AAR
        shell: bash
        run: gradle assembleDebug --configuration-cache

      - name: Upload universal AAR
        uses: actions/upload-artifact@v4
        with:
          name: libvlc3-universal
          path: libvlc/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 14

  publish-maven:
    name: publish-github-packages
    if: ${{ startsWith(github.ref, 'refs/tags/libvlc-') || (github.event_name == 'workflow_dispatch' && inputs.publish_package) }}
    needs: [resolve-vlc, package-aar]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      INPUT_MAVEN_VERSION: ${{ inputs.maven_version }}
      VLC_GIT_SHA: ${{ needs.resolve-vlc.outputs.sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download universal AAR
        uses: actions/download-artifact@v4
        with:
          name: libvlc3-universal
          path: package

      - name: Set up Maven authentication
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve Maven version and AAR
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            maven_version="${GITHUB_REF_NAME#libvlc-}"
          else
            maven_version="$INPUT_MAVEN_VERSION"
          fi
          if [[ ! "$maven_version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid or missing Maven version: $maven_version" >&2
            exit 1
          fi
          aar_file="$(find package -type f -name '*.aar' -print -quit)"
          test -s "$aar_file"
          echo "MAVEN_VERSION=$maven_version" >> "$GITHUB_ENV"
          echo "AAR_FILE=$aar_file" >> "$GITHUB_ENV"
          echo "Publishing $MAVEN_GROUP_ID:$MAVEN_ARTIFACT_ID:$maven_version"

      - name: Generate Maven POM
        shell: bash
        run: |
          set -euo pipefail
          pom_file="$RUNNER_TEMP/libvlc3.pom"
          cat > "$pom_file" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>${MAVEN_GROUP_ID}</groupId>
            <artifactId>${MAVEN_ARTIFACT_ID}</artifactId>
            <version>${MAVEN_VERSION}</version>
            <packaging>aar</packaging>
            <name>178me LibVLC 3 for Android</name>
            <description>LibVLC 3 Android bindings built from the 178meorg VLC fork</description>
            <url>https://github.com/178meorg/libvlcjni</url>
            <licenses>
              <license>
                <name>GNU Lesser General Public License, version 2.1</name>
                <url>https://www.gnu.org/licenses/old-licenses/lgpl-2.1.en.html</url>
                <distribution>repo</distribution>
              </license>
            </licenses>
            <developers>
              <developer>
                <id>178meorg</id>
                <name>178meorg</name>
                <url>https://github.com/178meorg</url>
              </developer>
            </developers>
            <scm>
              <connection>scm:git:https://github.com/178meorg/libvlcjni.git</connection>
              <developerConnection>scm:git:ssh://git@github.com/178meorg/libvlcjni.git</developerConnection>
              <url>https://github.com/178meorg/libvlcjni</url>
            </scm>
            <properties>
              <vlc.revision>${VLC_GIT_SHA}</vlc.revision>
            </properties>
            <dependencies>
              <dependency>
                <groupId>androidx.annotation</groupId>
                <artifactId>annotation</artifactId>
                <version>1.7.1</version>
                <scope>compile</scope>
              </dependency>
              <dependency>
                <groupId>androidx.legacy</groupId>
                <artifactId>legacy-support-v4</artifactId>
                <version>1.0.0</version>
                <scope>compile</scope>
              </dependency>
            </dependencies>
          </project>
          EOF
          echo "POM_FILE=$pom_file" >> "$GITHUB_ENV"

      - name: Publish to GitHub Packages
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -DrepositoryId=github \
            -Durl="$MAVEN_REPOSITORY_URL" \
            -Dfile="$AAR_FILE" \
            -DpomFile="$POM_FILE"
